# Publishes apps/web/dist to GitHub Pages on every push to main, after lint and
# test pass (epic cac-eil, decision D1). Pages must be enabled once by hand in
# the repository settings (Pages, Source: GitHub Actions); this workflow never
# enables it, because that needs a personal access token. The e2e suite is not
# run here: it needs a full Chromium install and runs locally instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# The default GITHUB_TOKEN, with only what a Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version input: the action reads pnpm from packageManager in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
