<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campo exam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5A3A;text-decoration:none}a:hover{color:#1C2620}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #F4F0E6; color: #1C2620; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 8px 12px;">
    <a href="A-Home.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #1C2620;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4F6650; font-weight: 600;">Exam</div>
      <div style="font-family: 'Fraunces', Georgia, serif; font-size: 16px; color: #5A6256;">7 of 20</div>
    </div>
    <div aria-label="Time left" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FBF8F1; border: 1px solid #1C2620; border-radius: 8px; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
      18:42
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 24px;">

    <div role="group" aria-label="Questions" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{ markers }}" as="m" hint-placeholder-count="20">
        <button type="button" aria-label="Question {{ m.n }}" style="height: 28px; min-width: 0; padding: 0; border-radius: 4px; cursor: pointer; font: 600 12px 'Source Sans 3', system-ui, sans-serif; border: 1px solid {{ m.line }}; background: {{ m.bg }}; color: {{ m.ink }};">{{ m.n }}</button>
      </sc-for>
    </div>

    <h1 style="margin: 6px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 26px; line-height: 1.25; font-weight: 600;">É proibido caçar:</h1>

    <div role="group" aria-label="Options" style="display: flex; flex-direction: column; gap: 8px;">
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; text-align: left; border-radius: 8px; cursor: pointer; font: 400 17px/1.35 'Source Sans 3', system-ui, sans-serif; color: #1C2620; border: 1px solid #D9D2C2; background: #FBF8F1;">
        <span style="flex: none; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 15px; border: 1px solid #1C2620;">A</span>
        <span style="flex: 1;">A 300 metros das casas de habitação</span>
      </button>
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; text-align: left; border-radius: 8px; cursor: pointer; font: 400 17px/1.35 'Source Sans 3', system-ui, sans-serif; color: #FBF8F1; border: 1px solid #1C2620; background: #1C2620;">
        <span style="flex: none; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 15px; border: 1px solid #FBF8F1;">B</span>
        <span style="flex: 1;">A 250 metros de uma estrada nacional</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; text-align: left; border-radius: 8px; cursor: pointer; font: 400 17px/1.35 'Source Sans 3', system-ui, sans-serif; color: #1C2620; border: 1px solid #D9D2C2; background: #FBF8F1;">
        <span style="flex: none; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 15px; border: 1px solid #1C2620;">C</span>
        <span style="flex: 1;">Nos aparcamentos de gado</span>
      </button>
    </div>

    <div style="font-size: 14px; color: #5A6256; text-align: center;">Answers are not marked until you submit. No English and no hints during the exam.</div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 8px; cursor: pointer; font: 600 16px 'Source Sans 3', system-ui, sans-serif; border: 1px solid #1C2620; background: #FBF8F1; color: #1C2620;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          Previous
        </button>
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 8px; cursor: pointer; font: 600 16px 'Source Sans 3', system-ui, sans-serif; border: 1px solid #2E5A3A; background: #2E5A3A; color: #FBF8F1;">
          Next
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 8px; cursor: pointer; font: 600 15px 'Source Sans 3', system-ui, sans-serif; border: 1px solid #B5461C; background: transparent; color: #B5461C;">Submit · 13 unanswered</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const markers = [];
    for (let n = 1; n <= 20; n += 1) {
      const answered = n <= 6;
      const current = n === 7;
      markers.push({
        n,
        bg: current ? '#B5461C' : answered ? '#2E5A3A' : '#FBF8F1',
        line: current ? '#B5461C' : answered ? '#2E5A3A' : '#D9D2C2',
        ink: current || answered ? '#FBF8F1' : '#5A6256'
      });
    }
    return { markers };
  }
}
</script>
</body>
</html>
